[project]
name = "energy-platform"
version = "0.0.0"
description = "German day-ahead market + PV/battery telemetry energy data platform"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "dagster>=1.10,<1.11",
    "dagster-webserver>=1.10,<1.11",
    "dagster-postgres>=0.26,<0.27",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<0.29",
]

[project.scripts]
energy-platform = "energy_platform.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "hypothesis>=6.100",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["energy_platform"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["energy_platform", "tests"]
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["dagster_postgres.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "postgres: requires a live Postgres database (raw-zone integration tests)",
]
