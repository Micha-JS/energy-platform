[project]
name = "energy-platform"
version = "0.0.0"
description = "German day-ahead market + PV/battery telemetry energy data platform"
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
dependencies = [
    "dagster>=1.10,<1.11",
    "dagster-webserver>=1.10,<1.11",
    "dagster-postgres>=0.26,<0.27",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.27,<0.29",
    # M6 dispatch optimiser. PuLP is pure Python and only builds the model; highspy is the HiGHS
    # MILP solver itself (prebuilt wheels, numpy its only runtime dependency). Deliberately not
    # linopy, whose array API would add numpy+scipy+xarray+dask+polars to express a
    # one-dimensional time index -- see the M6 design notes in the README.
    "pulp>=3.0,<4",
    "highspy>=1.7,<2",
    # Reads the dbt project's declared coverage_windows var, so the optimiser and the hourly spine
    # cannot disagree about which windows exist (see energy_platform.dispatch.windows).
    "pyyaml>=6.0,<7",
    # M7 forecasting. numpy is already here transitively (highspy, above); these are the first
    # dependencies that add pandas and scipy -- the cost the M6 note declined to pay for a
    # one-dimensional time index. Here the array is genuinely two-dimensional (hours x features)
    # and the alternative is hand-rolling solar geometry and a boosted-tree fit, so the trade goes
    # the other way. What keeps it honest is that the cost is *contained*:
    # tests/test_import_containment.py walks the AST of every module under src/energy_platform and
    # fails if any of these is imported outside forecasting/. The claim that buys is precise --
    # no FIRST-PARTY module outside forecasting/ touches the scientific stack, so the ingestion path
    # stays stdlib-only and M3's cross-platform content-hash guarantee is untouched. It is not the
    # claim that the process is numpy-free; importing energy_platform.cli has loaded numpy via
    # highspy since M6.
    #
    # pvlib for the physical PV model (solar position, POA transposition, cell temperature). Its
    # h5py/requests tail is unused here but is not separable from the wheel.
    "pvlib>=0.11,<0.16",
    # scikit-learn's HistGradientBoostingRegressor rather than LightGBM: it is the same histogram
    # algorithm, it has loss="quantile" for the p10/p50/p90 pinball reporting and routes NaN down a
    # learned branch instead of imputing (the "NaN over fabrication" invariant, in the model), and
    # its wheels vendor their own OpenMP runtime. LightGBM's macOS wheels require `brew install
    # libomp`, which would make `git clone && just demo` fail on a Mac -- at this data scale its
    # speed advantage buys nothing in exchange.
    "scikit-learn>=1.4,<2",
    # Both ship with scikit-learn, and both are imported directly: joblib to persist artefacts,
    # threadpoolctl to pin the fit to one thread so a re-fit reproduces on a given machine.
    "joblib>=1.4,<2",
    "threadpoolctl>=3.5,<4",
    # M10's plan publisher. A RUNTIME dependency rather than an extra, unlike the dashboard: the
    # scheduled publish job runs inside the Dagster daemon, whose image installs `--no-dev` main
    # dependencies only, so an extra would simply not be there when the schedule fired. The weight
    # argument that made Streamlit an extra does not apply either -- paho is a single pure-Python
    # wheel with no transitive dependencies. It is still imported lazily, inside
    # energy_platform.publishing.client.connect, so `energy-platform backfill` does not load an
    # MQTT stack to write rows to Postgres; test_import_containment.py asserts that.
    # Pinned to 2.x: the 1.x -> 2.x callback API is a breaking change (CallbackAPIVersion).
    "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
# M9's dashboard. An EXTRA rather than a runtime dependency: the Dagster webserver, the daemon and
# every CLI invocation would otherwise carry Streamlit's tail for a page they never render, which
# is the same "pure weight in the container" argument the matplotlib note below makes. The
# Dockerfile installs it in one stage only; `uv sync --extra dashboard` gets it locally.
#
# The boundary is enforced, not intended: tests/test_import_containment.py fails if anything under
# src/energy_platform imports streamlit, altair or pandas, so the app has to stay in dashboard/ --
# exactly as report_regret.py has to stay in scripts/.
dashboard = [
    "streamlit>=1.40,<2",
    # Altair and pandas both already arrive inside Streamlit, so naming them adds no wheel. They
    # are declared anyway because the dashboard imports them directly, and depending on another
    # package's transitive closure is how a minor bump elsewhere breaks a chart here. Altair is
    # chosen over adding plotly for the same reason it is free: it is already installed, and it
    # gives the encoding control (colour bound to a scenario key, a role set apart without
    # implying a rank, a diverging axis) that st.line_chart does not.
    "altair>=5.4,<6",
    "pandas>=2.2,<3",
]

[project.scripts]
energy-platform = "energy_platform.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "hypothesis>=6.100",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12.20260724",
    # M8's README figure only. Deliberately a dev dependency and not a runtime one: the chart is a
    # reporting artefact regenerated by `just figure`, not something the platform needs to run, and
    # a plotting stack in the container would be pure weight. The boundary is enforced rather than
    # intended -- tests/test_import_containment.py fails if anything under src/energy_platform
    # imports matplotlib, so the script has to stay in scripts/.
    "matplotlib>=3.8,<4",
    # M10 ships Jinja value_templates inside its Home Assistant discovery configs. They are
    # rendered by Home Assistant, not by us, so nothing in the runtime path would ever catch a
    # broken one -- it would surface as a row of "unknown" sensors in somebody's house. Declared
    # explicitly rather than leaned on transitively (Dagster brings it): depending on another
    # package's closure is how a minor bump elsewhere silently drops a test.
    "jinja2>=3.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/energy_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["energy_platform", "dashboard"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["energy_platform", "tests", "dashboard"]
namespace_packages = true
explicit_package_bases = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["dagster_postgres.*"]
ignore_missing_imports = true

# PuLP ships no type stubs. The untyped surface is deliberately confined to
# energy_platform.dispatch.optimizer, which hands typed dataclasses back to everything else.
[[tool.mypy.overrides]]
module = ["pulp.*"]
ignore_missing_imports = true

# Neither pvlib nor scikit-learn ships py.typed. Same containment as PuLP, one layer wider: the
# untyped surface is confined to energy_platform.forecasting, which hands frozen dataclasses back
# to the CLI, the Dagster asset and the store. tests/test_import_containment.py enforces the
# boundary rather than trusting it.
[[tool.mypy.overrides]]
module = ["pvlib.*", "sklearn.*", "pandas.*", "joblib.*", "threadpoolctl.*"]
ignore_missing_imports = true

# Altair's builder API is typed as returning Any from every chained call -- `.encode()`,
# `.properties()`, `+` -- so a function that honestly returns a chart trips no-any-return on its
# last line. Confined to the one module whose entire job is building charts, which is the same
# containment PuLP and scikit-learn get above: the untyped surface lives in one place and hands
# typed values to everything else. The rest of dashboard/ stays strict.
[[tool.mypy.overrides]]
module = ["dashboard.charts"]
disable_error_code = ["no-any-return"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "postgres: requires a live Postgres database (raw-zone and derived-zone integration tests)",
    "mqtt: requires a live MQTT broker (the M10 retention integration test)",
]
