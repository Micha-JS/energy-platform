name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      # Real Postgres so the raw-zone idempotency/no-op tests actually execute in CI.
      # SMARD itself is served from recorded fixtures -- no live API calls here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dagster
          POSTGRES_PASSWORD: dagster
          POSTGRES_DB: dagster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dagster -d dagster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install (frozen)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy src tests
      - name: pytest
        run: uv run pytest
        env:
          # Fail (don't skip) the raw-zone tests if this service Postgres is unreachable --
          # the whole point of the container is that those tests actually run in CI.
          ENERGY_REQUIRE_POSTGRES: "1"
          ENERGY_PG_HOST: localhost
          ENERGY_PG_PORT: "5432"
          ENERGY_PG_USER: dagster
          ENERGY_PG_PASSWORD: dagster
          ENERGY_PG_DB: dagster

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config -q
