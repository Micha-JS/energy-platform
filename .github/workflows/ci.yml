name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      # Real Postgres so the raw-zone idempotency/no-op tests actually execute in CI.
      # SMARD itself is served from recorded fixtures -- no live API calls here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dagster
          POSTGRES_PASSWORD: dagster
          POSTGRES_DB: dagster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dagster -d dagster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install (frozen)
        # --extra dashboard so the M9 Streamlit app is type-checked and its AppTest suite runs
        # here. That suite's most important member -- every page degrading gracefully against an
        # EMPTY warehouse -- needs no marts at all, so this is the job that must run it: the dbt
        # job below has data, and a graceful-no-data test that only ever sees data proves nothing.
        run: uv sync --frozen --extra dashboard
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run --extra dashboard mypy src tests dashboard
      - name: Create the dashboard's read-only role
        # So the empty-warehouse tests connect as dashboard_ro, exactly as the app does. Without
        # it they would fall back to testing the unreachable-database branch instead -- graceful
        # either way, but not the branch being asserted.
        run: |
          PGPASSWORD=dagster psql -h localhost -U dagster -d dagster \
            -v ON_ERROR_STOP=1 -f dashboard/sql/grant_read_only.sql
      - name: Start an MQTT broker
        # A `docker run` step rather than a `services:` block, and not by preference: mosquitto 2.x
        # refuses non-local connections until a listener is configured, and GitHub's `services:`
        # can set `options:` but cannot mount a config file. The same ci/mosquitto.conf backs the
        # compose `broker` profile, so CI and the demo run one broker configuration.
        run: |
          docker run -d --name mosquitto -p 1883:1883 \
            -v "$PWD/ci/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2
          for _ in $(seq 1 30); do
            if docker exec mosquitto mosquitto_pub -h localhost -t ci/ready -m ok; then exit 0; fi
            sleep 1
          done
          echo "mosquitto did not accept a publish within 30s" >&2
          docker logs mosquitto >&2
          exit 1
      - name: pytest
        # --extra on every invocation, not just the sync: `uv run` re-syncs the environment to the
        # options it is given, so a bare `uv run` here would uninstall Streamlit before the
        # dashboard tests could use it.
        run: uv run --extra dashboard pytest
        env:
          # Fail (don't skip) the raw-zone tests if this service Postgres is unreachable --
          # the whole point of the container is that those tests actually run in CI.
          ENERGY_REQUIRE_POSTGRES: "1"
          ENERGY_PG_HOST: localhost
          ENERGY_PG_PORT: "5432"
          ENERGY_PG_USER: dagster
          ENERGY_PG_PASSWORD: dagster
          ENERGY_PG_DB: dagster
          # Same rule for the broker. Retention is a behaviour of the broker rather than of our
          # code, so the one test that proves a retained plan reaches a later subscriber has to
          # run against a real one -- and must fail, not skip, when it cannot.
          ENERGY_REQUIRE_MQTT: "1"
          ENERGY_MQTT_HOST: localhost
          ENERGY_MQTT_PORT: "1883"

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config -q

  dbt:
    # Rebuild the analytics warehouse from the *real* shipped CLI: seed the raw zone offline
    # (recorded fixtures, no live APIs), then `dbt build` with every test. The two seeded windows
    # straddle both 2024 DST transitions, so the 23h/25h singular tests actually execute.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dagster
          POSTGRES_PASSWORD: dagster
          POSTGRES_DB: dagster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dagster -d dagster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENERGY_PG_HOST: localhost
      ENERGY_PG_PORT: "5432"
      ENERGY_PG_USER: dagster
      ENERGY_PG_PASSWORD: dagster
      ENERGY_PG_DB: dagster
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install app (frozen)
        run: uv sync --frozen
      - name: Install dbt toolchain (isolated, frozen)
        run: uv sync --frozen --project dbt
      - name: dbt deps
        run: uv run --project dbt dbt deps --project-dir dbt --profiles-dir dbt
      - name: Seed raw zone offline (all coverage windows + forecast vintages)
        run: |
          uv run energy-platform backfill --offline \
            --from 2024-03-28 --to 2024-06-30 --datasets price,load,weather,telemetry
          uv run energy-platform backfill --offline \
            --from 2024-10-24 --to 2024-10-30 --datasets price,load,weather,telemetry
          # No --issue-date: offline derives it from the recorded fixture, so the vintage
          # describes the payload it actually carries. One recorded fixture is one honest vintage
          # (forecasts accrue forward -- a second requires a second recording), so vintage
          # accrual is asserted by the forecast_vintages_do_not_collapse dbt unit test instead.
          uv run energy-platform forecast-snapshot --offline
          # Synthetic vintages: the retrospective mirror of the snapshot above, and the only way
          # the demo has both a forecast and its own outcome in one window. Each stops two days
          # short of its window's end because a vintage degrades the archive weather for its own
          # 48-hour horizon, and the fixtures end with the window.
          uv run energy-platform forecast-backfill --issue-from 2024-03-28 --issue-to 2024-06-28
          uv run energy-platform forecast-backfill --issue-from 2024-10-24 --issue-to 2024-10-28
      - name: Assert re-seed is a verifiable no-op (idempotency invariant)
        run: |
          out=$(uv run energy-platform backfill --offline \
            --from 2024-03-28 --to 2024-06-30 --datasets price,load,weather,telemetry 2>&1)
          echo "$out"
          echo "$out" | grep -Eq "loaded=0 noop=[0-9]+ revision=0 .* failures=0" \
            || { echo "::error::re-seed was not an all-noop -- ingestion is not idempotent"; exit 1; }
      - name: dbt build (models + all tests, incl. DST singular tests)
        # Everything except the read-back marts, which read tables the Python steps have not written
        # yet. Each of those steps consumes a mart and produces a source, so they sit between two
        # dbt runs -- `just warehouse` is this same sequence for local use.
        run: |
          uv run --project dbt dbt build --project-dir dbt --profiles-dir dbt \
            --exclude mart_dispatch_comparison mart_forecast_eval mart_dispatch_regret \
            mart_forward_dispatch_daily
      - name: Solve the battery dispatch optimiser over every coverage window
        # Reads mart_hourly_energy, writes the `derived` schema. No network, no solver licence:
        # HiGHS ships as a wheel. Windows come from dbt_project.yml's coverage_windows var, read by
        # the package itself, so CI cannot drift from the declaration the spine is built on.
        run: uv run energy-platform dispatch
      - name: Backtest the forecast models (expanding-window CV)
        # Reads mart_hourly_energy AND stg_weather_forecast, writes derived.forecast_*. Same
        # dbt -> python -> dbt sandwich as the optimiser above.
        #
        # OMP_NUM_THREADS=1 is load-bearing: HistGradientBoosting accumulates histograms across
        # threads, so the summation order -- and the last bits of every split -- follow the thread
        # count. random_state does not cover this; the thread count is the actual lever.
        env:
          OMP_NUM_THREADS: "1"
        run: uv run energy-platform forecast
      - name: Roll the forward-looking dispatch simulation (M8)
        # Plans each Berlin day from the forecasts available at D 00:00 Europe/Berlin, executes the
        # plan against the actuals, and writes the three-way comparison. Last of the three Python
        # steps: it reads the energy mart and the weather vintages, and fits a model per fold, which
        # is why it pins the thread count for the same reason the backtest does.
        env:
          OMP_NUM_THREADS: "1"
        run: uv run energy-platform forward-dispatch
      - name: dbt build (the read-back marts + their tests)
        run: |
          uv run --project dbt dbt build --project-dir dbt --profiles-dir dbt \
            --select mart_dispatch_comparison mart_forecast_eval mart_dispatch_regret \
            mart_forward_dispatch_daily
      - name: Assert the committed README figure still matches the warehouse
        # Values, not pixels. The script recomputes what it would plot and diffs it against the
        # committed JSON sidecar, so a stale figure fails here instead of quietly misreporting the
        # headline -- without ever asserting on PNG bytes, which differ across font stacks.
        run: uv run python scripts/report_regret.py --check
      - name: Warehouse guards (no-lookahead + tariff and dispatch reconciliations)
        # All three need a built warehouse, so they run here rather than in `quality`, where they
        # skip. ENERGY_REQUIRE_DBT turns those skips into failures: a reconciliation that silently
        # did not run is indistinguishable from one that passed.
        run: uv run pytest tests/dbt
        env:
          ENERGY_REQUIRE_POSTGRES: "1"
          ENERGY_REQUIRE_DBT: "1"
      - name: Grant the dashboard's read-only role
        # After the build, so `grant select on all tables` picks up every mart that now exists.
        # The same file compose runs on a fresh volume, where the default-privileges half is what
        # does the work instead -- it is written to be correct from either direction.
        run: |
          PGPASSWORD=dagster psql -h localhost -U dagster -d dagster \
            -v ON_ERROR_STOP=1 -f dashboard/sql/grant_read_only.sql
      - name: Dashboard smoke tests against the built warehouse
        # The seeded half of tests/dashboard: every page renders, the banner reports the data mode
        # the warehouse actually holds, and every column the app selects exists. These skip in
        # `quality` for want of marts, so ENERGY_REQUIRE_DBT makes the skip a failure here -- a
        # smoke test that silently did not run is indistinguishable from one that passed.
        run: uv run --extra dashboard pytest tests/dashboard
        env:
          ENERGY_REQUIRE_POSTGRES: "1"
          ENERGY_REQUIRE_DBT: "1"
          ENERGY_DASHBOARD_PG_USER: dashboard_ro
          ENERGY_DASHBOARD_PG_PASSWORD: dashboard_ro
      - name: dbt docs generate
        run: uv run --project dbt dbt docs generate --project-dir dbt --profiles-dir dbt
      - name: Upload docs as Pages artifact
        # Only main deploys to Pages (see the `pages` job), so only main needs the artifact --
        # building/uploading it on branch/PR runs is wasted work.
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target

  pages:
    # Publish the dbt docs site to GitHub Pages on main only. One-time setup: repo
    # Settings -> Pages -> Source = "GitHub Actions".
    if: github.ref == 'refs/heads/main'
    needs: dbt
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
