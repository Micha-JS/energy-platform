name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      # Real Postgres so the raw-zone idempotency/no-op tests actually execute in CI.
      # SMARD itself is served from recorded fixtures -- no live API calls here.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dagster
          POSTGRES_PASSWORD: dagster
          POSTGRES_DB: dagster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dagster -d dagster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install (frozen)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy src tests
      - name: pytest
        run: uv run pytest
        env:
          # Fail (don't skip) the raw-zone tests if this service Postgres is unreachable --
          # the whole point of the container is that those tests actually run in CI.
          ENERGY_REQUIRE_POSTGRES: "1"
          ENERGY_PG_HOST: localhost
          ENERGY_PG_PORT: "5432"
          ENERGY_PG_USER: dagster
          ENERGY_PG_PASSWORD: dagster
          ENERGY_PG_DB: dagster

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config -q

  dbt:
    # Rebuild the analytics warehouse from the *real* shipped CLI: seed the raw zone offline
    # (recorded fixtures, no live APIs), then `dbt build` with every test. The two seeded windows
    # straddle both 2024 DST transitions, so the 23h/25h singular tests actually execute.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dagster
          POSTGRES_PASSWORD: dagster
          POSTGRES_DB: dagster
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dagster -d dagster"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENERGY_PG_HOST: localhost
      ENERGY_PG_PORT: "5432"
      ENERGY_PG_USER: dagster
      ENERGY_PG_PASSWORD: dagster
      ENERGY_PG_DB: dagster
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.14"
          enable-cache: true
      - name: Install Python 3.12
        run: uv python install 3.12
      - name: Install app (frozen)
        run: uv sync --frozen
      - name: Install dbt toolchain (isolated, frozen)
        run: uv sync --frozen --project dbt
      - name: dbt deps
        run: uv run --project dbt dbt deps --project-dir dbt --profiles-dir dbt
      - name: Seed raw zone offline (both DST windows + forecast vintages)
        run: |
          uv run energy-platform backfill --offline \
            --from 2024-03-28 --to 2024-04-03 --datasets price,load,weather,telemetry
          uv run energy-platform backfill --offline \
            --from 2024-10-24 --to 2024-10-30 --datasets price,load,weather,telemetry
          uv run energy-platform forecast-snapshot --offline --issue-date 2024-03-28
          uv run energy-platform forecast-snapshot --offline --issue-date 2024-03-29
      - name: Assert re-seed is a verifiable no-op (idempotency invariant)
        run: |
          out=$(uv run energy-platform backfill --offline \
            --from 2024-03-28 --to 2024-04-03 --datasets price,load,weather,telemetry 2>&1)
          echo "$out"
          echo "$out" | grep -Eq "loaded=0 noop=[0-9]+ revision=0 .* failures=0" \
            || { echo "::error::re-seed was not an all-noop -- ingestion is not idempotent"; exit 1; }
      - name: dbt build (models + all tests, incl. DST singular tests)
        run: uv run --project dbt dbt build --project-dir dbt --profiles-dir dbt
      - name: No-lookahead guard (manifest exists after build)
        run: uv run pytest tests/dbt/test_no_lookahead.py
      - name: dbt docs generate
        run: uv run --project dbt dbt docs generate --project-dir dbt --profiles-dir dbt
      - name: Upload docs as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt/target

  pages:
    # Publish the dbt docs site to GitHub Pages on main only. One-time setup: repo
    # Settings -> Pages -> Source = "GitHub Actions".
    if: github.ref == 'refs/heads/main'
    needs: dbt
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
