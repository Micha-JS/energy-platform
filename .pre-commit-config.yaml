repos:
  # ruff and mypy run through the uv-locked environment so pre-commit and CI
  # (which runs `uv run ruff` / `uv run mypy`) share a single version source: uv.lock.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        always_run: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # dbt YAML embeds Jinja (e.g. env_var in profiles.yml), which a plain YAML parser rejects.
        exclude: ^dbt/
      - id: check-toml
      - id: check-added-large-files
