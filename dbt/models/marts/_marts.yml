version: 2

models:
  - name: mart_hourly_energy
    description: >
      Energy balance and price for every hour in declared coverage, UTC + Europe/Berlin calendar,
      NULL where any source has a gap. The M5/M6 foundation. Grain: (ts_utc, region).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [ts_utc, region]
    columns:
      - name: ts_utc
        tests: [not_null]
      - name: local_date
        tests: [not_null]
      - name: soc_frac
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1, config: {where: "soc_frac is not null"}}
      - name: price_eur_mwh
        tests:
          - dbt_utils.accepted_range: {min_value: -500, max_value: 4000, config: {where: "price_eur_mwh is not null"}}
      - name: pv_production_kwh
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "pv_production_kwh is not null"}}
      - name: household_load_kwh
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "household_load_kwh is not null"}}

  - name: mart_tariff_counterfactuals
    description: >
      What the household would have paid per month under each tariff, with and without the
      battery. Money in EUR, energy in kWh. Coverage is part of the answer: no month in the seeded
      demo is complete, so every row carries expected_hours (DST-correct calendar length),
      covered_hours (declared coverage), priced_hours, gap_hours, completeness_ratio, and
      is_partial_month. The base fee is pro-rated by completeness; base_fee_eur_month keeps the
      full figure so that can be undone. Check battery_unreturned_kwh before comparing scenarios --
      the synthetic generator resets state of charge nightly, which charges the battery scenario
      for energy it never returns. Grain: (local_month, region, scenario, tariff_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [local_month, region, scenario, tariff_id]
    columns:
      - name: local_month
        description: First day of the Europe/Berlin calendar month.
        tests: [not_null]
      - name: region
        tests: [not_null]
      - name: scenario
        tests:
          - not_null
          - accepted_values: {values: ["battery", "no_battery"]}
      - name: tariff_id
        tests: [not_null]
      - name: total_cost_eur
        description: energy_cost_eur + the pro-rated base fee, gross of VAT.
      - name: net_cost_eur
        description: total_cost_eur - feed_in_revenue_eur; negative means the month earned money.
      - name: battery_unreturned_kwh
        description: >
          Charged but not discharged within the period. A few percent of charge is honest
          round-trip loss; a large value is the synthetic generator's midnight SoC reset, which
          makes the battery scenario carry cost without benefit. NULL for no_battery.
      - name: feed_in_revenue_eur
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "feed_in_revenue_eur is not null"}}
      - name: expected_hours
        description: Hours in the calendar month, from the Berlin calendar -- 743 in March, 745 in October.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 672, max_value: 745}
      - name: covered_hours
        description: >
          Hours of the month inside the declared coverage_windows. Separates "never covered" from
          "covered and gapped"; never exceeds expected_hours.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 745}
      - name: priced_hours
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: completeness_ratio
        description: priced_hours / expected_hours. Below 1 means the month is partly seeded.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: is_partial_month
        tests: [not_null]

  - name: mart_solar_economics
    description: >
      What the sun earned: self-consumption and autarky rates, and the value of a PV kWh split
      between grid cost avoided and feed-in revenue. Keeping the scenario dimension is the point --
      the difference between battery and no_battery is what the battery does. Rates are computed
      over the same priced-hour population as their denominator and are NULL where the denominator
      is zero. Carries the same coverage columns as mart_tariff_counterfactuals -- expected_hours,
      covered_hours, priced_hours, gap_hours, completeness_ratio, is_partial_month -- so no monthly
      row is presented as if it were whole. Grain: (local_month, region, scenario, tariff_id).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [local_month, region, scenario, tariff_id]
    columns:
      - name: local_month
        tests: [not_null]
      - name: scenario
        tests:
          - not_null
          - accepted_values: {values: ["battery", "no_battery"]}
      - name: tariff_id
        tests: [not_null]
      - name: self_consumed_kwh
        description: >
          Load served without the grid (load - import) -- the shared numerator of both rates, and
          exactly the import that avoided_grid_cost_eur prices.
      - name: self_consumption_rate
        description: self_consumed_kwh / pv_production_kwh. NULL for a month with no generation.
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1, config: {where: "self_consumption_rate is not null"}}
      - name: autarky_rate
        description: self_consumed_kwh / household_load_kwh. NULL for a month with no load.
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1, config: {where: "autarky_rate is not null"}}
      - name: battery_unreturned_kwh
        description: >
          Charged but not discharged within the period. Round-trip losses account for a few percent
          legitimately; a large value means the synthetic generator's midnight SoC reset discarded
          stored energy, which makes the battery scenario look worse than the hardware is. NULL for
          no_battery. Read this before comparing scenarios.
      - name: avoided_grid_cost_eur
        description: >
          Self-consumed kWh valued at the import price of the hour they were consumed in -- summed
          hourly, never derived from a monthly average price (which a dynamic tariff would break).
      - name: expected_hours
        description: Hours in the calendar month, from the Berlin calendar -- 743 in March, 745 in October.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 672, max_value: 745}
      - name: covered_hours
        description: >
          Hours of the month inside the declared coverage_windows. Separates "never covered" from
          "covered and gapped"; never exceeds expected_hours.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 745}
      - name: priced_hours
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: completeness_ratio
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: is_partial_month
        tests: [not_null]

  - name: mart_dispatch_comparison
    description: >
      What a perfectly-dispatched battery would have cost, per coverage window and consumption
      tariff, against three baselines: no battery at all, the naive self-consumption the M3
      generator actually emitted, and the same naive policy with state of charge carried across the
      window. Money in EUR, energy in kWh, energy cost only -- the standing charge is identical in
      every scenario and cancels out of every saving.

      RANK SCENARIOS BY adjusted_net_cost_eur, never by net_cost_eur. It is the quantity the
      optimiser minimises: net cost less the value of the energy still stored at the window's end.
      Without that term a hindsight optimum simply empties the battery on the last evening and
      books the proceeds as savings. The adjustment is fully exposed so it can be undone.

      COMPARE AGAINST naive_continuous. The generator restarts each Berlin day from a fixed state of
      charge -- the price of its per-partition purity -- so naive_telemetered carries the cost of
      energy it bought and discarded at midnight, visible in battery_unreturned_kwh. It is reported
      because it is what the warehouse holds, not because it is a fair baseline.

      Values are stable; schedules are not. An optimal dispatch is non-unique, so this mart and its
      tests assert on cost and on invariants and never on a specific hour -- see the `derived`
      source for why the raw zone's content-hash contract deliberately stops here.
      Grain: (window_start, window_end, region, tariff_id, scenario).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [window_start, window_end, region, tariff_id, scenario]
    columns:
      - name: window_start
        description: First Europe/Berlin day of the declared coverage window, inclusive.
        tests: [not_null]
      - name: window_end
        description: Last Europe/Berlin day of the window, inclusive.
        tests: [not_null]
      - name: region
        tests: [not_null]
      - name: tariff_id
        tests: [not_null]
      - name: scenario
        tests:
          - not_null
          - accepted_values:
              values: ["no_battery", "naive_telemetered", "naive_continuous", "optimal"]
      - name: net_cost_eur
        description: energy_cost_eur - feed_in_revenue_eur. Negative means the window earned money.
      - name: terminal_soc_delta_kwh
        description: >
          Stored energy at the end of the window less what it started with, as settlement used it.
          Zero for no_battery, which has no store whose level could change; negative for a window
          that ends emptier than it started, where the credit is a debit.

          Quantised at 1e-6 kWh rather than the 1 Wh the SoC levels and the schedule use: this is a
          settlement input the credit is computed *from*, so its quantum lands on the objective the
          scenarios are ranked by. It is therefore NOT soc_end_kwh - soc_start_kwh recomputed from
          rounded levels -- that would reproduce the credit only to within a Wh's worth of money.
        tests: [not_null]
      - name: terminal_value_ct_kwh
        description: >
          What a stored kWh was credited at: the cheapest non-negative import price the window
          offered, a deliberate lower bound. Crediting at the mean instead would make ending the
          window full profitable in itself and the optimiser would hoard.

          This is what a *delivered* kWh is worth. Multiply by terminal_discharge_efficiency to
          price a stored one -- see terminal_value_eur.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: terminal_discharge_efficiency
        description: >
          sqrt(round_trip_efficiency), the factor converting a stored kWh into a delivered one. A
          kWh in the store can only ever reach the AC node through the discharge leg, so this is
          what settlement credits it at. Exposed here because the reconstruction recipe under
          terminal_value_eur is wrong without it -- omitting it overstates the credit by about 5% at
          the configured battery.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: terminal_value_eur
        description: >
          The credit for the energy the window ends holding, and the whole of the difference between
          net_cost_eur and adjusted_net_cost_eur. Exactly reconstructible from the three factors
          this mart exposes, which is what lets a reader re-value the terminal state without
          re-solving:

              terminal_value_eur = round(terminal_value_ct_kwh / 100
                                         * terminal_discharge_efficiency
                                         * terminal_soc_delta_kwh, 6)

          Substitute any other rate for terminal_value_ct_kwh to get the credit at that valuation.
          assert_terminal_value_is_reconstructible holds settlement to this identity, so the recipe
          cannot silently drift from the arithmetic that produced the number.
        tests: [not_null]
      - name: adjusted_net_cost_eur
        description: >
          net_cost_eur - terminal_value_eur. The optimiser's objective, and the only column the four
          scenarios may be ranked by.
        tests: [not_null]
      - name: battery_unreturned_kwh
        description: >
          Charged but not discharged within the window. A few percent of charge is honest
          round-trip loss; a large value is the generator's midnight reset, which is why
          naive_telemetered is not the baseline. Zero for no_battery.
      - name: savings_vs_naive_continuous_eur
        description: >
          The headline figure, on the `optimal` row: how much cheaper hindsight-optimal dispatch was
          than the same naive policy run with continuous state of charge. Never negative on that
          row -- naive_continuous is a feasible point of the optimiser's own problem.
      - name: savings_vs_no_battery_eur
        description: What the battery was worth at all, against a PV-only household.
      - name: savings_vs_naive_continuous_pct
        description: >
          A fraction, not a percent, despite the suffix. NULL where the baseline cost nothing or
          earned money -- a percentage saving off a negative bill is arithmetic dressed up as a
          result.

          NOT capped at 1. An optimum that turns a positive baseline cost into a net credit has
          saved more than 100% of that cost, which is a result and not a defect -- plausible on a
          dynamic-tariff week with real arbitrage. Nor is it bounded below in general:
          naive_telemetered can be arbitrarily worse than naive_continuous, and how much worse is
          the M3 midnight reset being measured, which is the point of reporting it.

          The one bound that is a theorem holds on the `optimal` row, and is what is tested: the
          branch already gates on a positive baseline, and naive_continuous is a feasible point of
          the optimiser's own problem, so the optimum cannot have saved a negative fraction of it.
          This is the ratio-side gate on optimality; assert_optimal_never_costs_more_than_naive is
          the same claim in euros.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                where: "scenario = 'optimal' and savings_vs_naive_continuous_pct is not null"
      - name: solver
        description: "'highs' for the optimum; 'simulated' or 'telemetered' for the baselines."
        tests: [not_null]
      - name: solver_status
        description: The solver's own verdict. Anything but 'Optimal' means the row is not a minimum.
        tests:
          - not_null
          - accepted_values: {values: ["Optimal", "Simulated"]}
      - name: expected_hours
        description: >
          Hours the window claims, from the Berlin calendar -- 167 across the spring-forward week,
          169 across fall-back. Never counted from these rows.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, max_value: 8784}
      - name: priced_hours
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: completeness_ratio
        description: priced_hours / expected_hours. Below 1 means the window is partly unpriced.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1}
      - name: is_partial_window
        tests: [not_null]

  - name: mart_data_quality
    description: >
      Per-source coverage gaps, nulls, and freshness. One row per (source, dataset, region,
      resolution). A view, so freshness_lag is live.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source, dataset, region, resolution]
    columns:
      - name: source
        tests: [not_null]
      - name: dataset
        tests: [not_null]
      - name: present_hours
        tests:
          - dbt_utils.accepted_range: {min_value: 0}
      - name: expected_hours
        tests:
          - dbt_utils.accepted_range: {min_value: 0}

  - name: mart_forecast_eval
    description: >
      Day-ahead forecast accuracy per model per horizon hour, with the naive baselines beside every
      model. Reads the Python-written derived.forecast_* tables, so it builds AFTER
      `energy-platform forecast` -- see `just warehouse`.

      READ `role` BEFORE RANKING ANYTHING. On synthetic windows `toy_physical` is the flat-plate
      model M3 GENERATED THE LABELS WITH, so it carries role='oracle' and beating the field is a
      tautology, not a result. `baseline` marks persistence and seasonal_naive. Ordering by mae_kwh
      across all roles produces a leaderboard whose winner means nothing.

      The pvlib model losing to the toy on seeded data is expected and is the honest finding: the
      synthetic truth has no panel tilt, so plane-of-array transposition is biased against it by
      construction. The prediction M7 ships is that this ranking INVERTS on real Fenecon telemetry,
      because a real array is tilted. Until that data exists the seeded comparison cannot settle it.

      Every model resolves against the same issue instant, the same selected vintage
      (`selection_rule_id`) and the same observation lag (`telemetry_lag_hours`), which is what
      makes the comparison like-for-like. Quantile columns are null for point-forecast models --
      null rather than zero, because a model that made no interval claim has not earned a perfect
      interval score. `interval_coverage_p10_p90` is reported against a target of 0.80, never
      claimed as calibrated.

      Grain: (site, target, model_key, window_start, window_end, horizon_hour).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [site, target, model_key, window_start, window_end, horizon_hour]
    columns:
      - name: site
        tests: [not_null]
      - name: target
        tests:
          - not_null
          - accepted_values: {values: ["pv_production_kwh", "household_load_kwh"]}
      - name: model_key
        tests: [not_null]
      - name: role
        description: >
          'oracle' = the data-generating process (never a competitor), 'baseline' = a naive model
          every model row is read against, 'model' = an actual forecast.
        tests:
          - not_null
          - accepted_values: {values: ["oracle", "baseline", "model"]}
      - name: horizon_hour
        tests: [not_null]
      - name: scored_hours
        description: Hours with both a prediction and an actual. A gap is never scored as a zero.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1}
      - name: mae_kwh
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "mae_kwh is not null"}}
      - name: rmse_kwh
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "rmse_kwh is not null"}}
      - name: pinball_p50_kwh
        description: >
          Half the MAE by construction -- the identity the reconciliation test pins. Populated for
          every model including the point-forecast ones: a scoreable hour has a p50 by definition.
          Only the p10/p90 losses are null for models that made no interval claim.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "pinball_p50_kwh is not null"}}
      - name: interval_coverage_p10_p90
        description: Empirical fraction inside [p10, p90]. Target 0.80; reported, not claimed.
        tests:
          - dbt_utils.accepted_range:
              {min_value: 0, max_value: 1, config: {where: "interval_coverage_p10_p90 is not null"}}
      - name: selection_rule_id
        tests: [not_null]
      - name: telemetry_lag_hours
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: training_data_source
        tests:
          - not_null
          - accepted_values: {values: ["synthetic", "real"]}
      - name: config_hash
        tests: [not_null]

  - name: mart_dispatch_regret
    description: >
      THE HEADLINE. Of the savings a perfectly-informed battery schedule would have produced, how
      much did dispatch driven by real day-ahead forecasts actually capture? One row per coverage
      window, site and consumption tariff -- wide rather than per-scenario, because regret and
      captured share are relations *between* scenarios.

      Four costs, all objective_eur over the same simulated span, from the same starting state of
      charge, settled at the same terminal rate: naive_continuous (the baseline a household gets
      for free), forecast_driven (what the platform can really deliver), perfect_foresight_plan
      (the same day-ahead controller handed the actuals, which is what separates forecast error
      from myopia) and hindsight (the ceiling nobody reaches).

      THE SPAN IS NOT THE WINDOW. The forecast models need min_train_days of warm-up, so the
      simulation starts later than the window it belongs to; sim_start/sim_end/simulated_days
      record what was covered and expected_hours is the Berlin calendar length of THAT span. A
      window with no fitted model is present with is_simulated = false and a reason, never absent.

      QUOTE captured_value_share, NOT A EURO FIGURE. A euro total over a 60-day span is not
      comparable to one over a year or between a sunny window and a dark one; the share normalises
      by the size of the prize. It is bounded above by 1 because hindsight <= forecast_driven is a
      theorem -- so a value above 1 is a bug, not a triumph -- and it is deliberately NOT bounded
      below, because a bad forecast can legitimately underperform naive dispatch and that result is
      reported rather than suppressed. See assert_hindsight_never_costs_more_than_either for which
      orderings are theorems and which is emphatically not.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [window_start, window_end, region, tariff_id]
    columns:
      - name: window_start
        tests: [not_null]
      - name: window_end
        tests: [not_null]
      - name: region
        tests: [not_null]
      - name: tariff_id
        description: >
          The consumption tariff, or the sentinel '*' on a window that could not be simulated --
          the reason is about the models, not the money, so it is filed once rather than per tariff.
        tests: [not_null]
      - name: is_simulated
        tests: [not_null]
      - name: not_simulated_reason
        description: Why a declared window produced no simulation. Null exactly when is_simulated.
        tests:
          - accepted_values:
              values: ["no_fitted_model", "no_hours"]
              config: {where: "not_simulated_reason is not null"}
      - name: simulated_days
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1, config: {where: "is_simulated"}}
      - name: fallback_days
        description: >
          Days inside the span with no usable forecast, dispatched by naive self-consumption
          instead. A large value means the comparison is measuring the fallback, not the forecast.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: clipped_hours
        description: >
          Hours the plan asked for more than the battery could do and was projected back to
          feasibility. Not an error -- it is the recourse policy working -- but a high count means
          the plans were systematically infeasible against reality.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: naive_cost_eur
        tests: [not_null: {config: {where: "is_simulated"}}]
      - name: forecast_driven_cost_eur
        tests: [not_null: {config: {where: "is_simulated"}}]
      - name: perfect_foresight_cost_eur
        description: >
          The same rolling day-ahead controller handed the actuals as its forecast. Not a
          deliverable -- the instrument that splits regret into forecast error and myopia.
        tests: [not_null: {config: {where: "is_simulated"}}]
      - name: hindsight_cost_eur
        tests: [not_null: {config: {where: "is_simulated"}}]
      - name: regret_eur
        description: >
          The whole shortfall against perfect information. Non-negative by theorem, to within the
          settlement rounding budget the singular test derives. Equals
          forecast_error_cost_eur + myopia_cost_eur.
        tests:
          - dbt_utils.accepted_range:
              {min_value: -0.00001, config: {where: "regret_eur is not null"}}
      - name: forecast_error_cost_eur
        description: >
          The part of regret that better forecasts could remove. Non-negative by theorem: the
          perfect-foresight controller is the same controller with strictly better information.
        tests:
          - dbt_utils.accepted_range:
              {min_value: -0.00001, config: {where: "forecast_error_cost_eur is not null"}}
      - name: myopia_cost_eur
        description: >
          The part of regret no forecast could remove -- the price of deciding one day at a time
          instead of over the whole span. Non-negative by theorem.
        tests:
          - dbt_utils.accepted_range:
              {min_value: -0.00001, config: {where: "myopia_cost_eur is not null"}}
      - name: available_savings_eur
        description: The prize -- what perfect foresight was worth over naive dispatch.
      - name: realised_savings_eur
        description: What forecast-driven dispatch actually delivered over naive. May be negative.
      - name: captured_value_share
        description: >
          realised_savings_eur / available_savings_eur. Null where the prize was zero -- a window
          whose battery is PV-saturated has nothing to optimise, and a percentage of nothing is
          arithmetic dressed up as a result. NO LOWER BOUND IS TESTED, on purpose.
        tests:
          - dbt_utils.accepted_range:
              {max_value: 1.00001, config: {where: "captured_value_share is not null"}}
      - name: attainable_value_share
        description: >
          What a day-ahead controller with PERFECT information would have captured. The ceiling on
          captured_value_share that no forecasting work could lift, and the honest thing to read
          the headline against. Same absence of a lower bound, for the same reason.
        tests:
          - dbt_utils.accepted_range:
              {max_value: 1.00001, config: {where: "attainable_value_share is not null"}}
      - name: pv_model_key
        tests: [not_null: {config: {where: "is_simulated"}}]
      - name: load_model_key
        tests: [not_null: {config: {where: "is_simulated"}}]
      - name: decision_rule_id
        tests: [not_null]
      - name: price_publication_rule_id
        tests: [not_null]
      - name: selection_rule_id
        tests: [not_null]
      - name: training_data_source
        tests:
          - not_null
          - accepted_values: {values: ["synthetic", "real"]}
      - name: expected_hours
        description: Berlin calendar hours in the SIMULATED span, never in the declared window.
        tests:
          - dbt_utils.accepted_range: {min_value: 1, config: {where: "is_simulated"}}
      - name: completeness_ratio
        tests:
          - dbt_utils.accepted_range:
              {min_value: 0, max_value: 1, config: {where: "is_simulated"}}
      - name: scenario_rows
        description: >
          How many scenarios this comparison was assembled from -- four when simulated, one for a
          not-simulated marker. A different value means a scenario failed to write.
        tests:
          - not_null
          - accepted_values: {values: [1, 4], quote: false}

  - name: mart_forward_dispatch_daily
    description: >
      The rolling simulation day by day: four scenarios, one row each per simulated Berlin day,
      with the cumulative cost curve the README figure plots. The running total lives here rather
      than in the plotting script so the figure cannot drift from the mart.

      Only forecast_driven's day-by-day decision is recorded here. naive_continuous and optimal
      were never decided per day at all -- both are solved once over the span and merely settled
      per day -- and perfect_foresight_plan is rolled day by day but kept only as a decomposition
      instrument, so all three carry plan_status = 'not_planned' and null SoC and fit-day columns
      rather than a guess.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            [window_start, window_end, region, tariff_id, scenario, local_date]
    columns:
      - name: local_date
        tests: [not_null]
      - name: scenario
        tests:
          - not_null
          - accepted_values:
              values: ["naive_continuous", "forecast_driven", "perfect_foresight_plan", "optimal"]
      - name: plan_status
        description: >
          How this day's dispatch was arrived at. 'planned' means a day-ahead solve on forecasts;
          'fallback_naive' means the forecast was unusable and the controller self-consumed;
          'not_planned' means the scenario has no plan at all.
        tests:
          - not_null
          - accepted_values: {values: ["planned", "fallback_naive", "not_planned"]}
      - name: sim_day
        description: 1-based day index within the simulated span, so scenarios share an x-axis.
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 1}
      - name: soc_start_kwh
        tests:
          - not_null: {config: {where: "scenario = 'forecast_driven'"}}
          - dbt_utils.accepted_range:
              {min_value: 0, config: {where: "soc_start_kwh is not null"}}
      - name: soc_end_kwh
        tests:
          - not_null: {config: {where: "scenario = 'forecast_driven'"}}
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "soc_end_kwh is not null"}}
      - name: clipped_hours
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0}
      - name: pv_model_age_days
        description: >
          How stale the model that planned this day was, in days since its fold. Zero on a refit
          day, up to fold_stride_days - 1 the day before the next -- the cost of not retraining
          nightly, made visible rather than assumed negligible.
        tests:
          - dbt_utils.accepted_range:
              {min_value: 0, config: {where: "pv_model_age_days is not null"}}
      - name: expected_hours
        tests:
          - not_null
          - accepted_values: {values: [23, 24, 25], quote: false}
      - name: is_partial_day
        tests: [not_null]
