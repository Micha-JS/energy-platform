version: 2

models:
  - name: stg_prices
    description: >
      Day-ahead wholesale price (EUR/MWh); both resolutions. Grain (source, ts_utc, region,
      resolution) -- `source` is in the grain so a second market connector publishing the same
      bidding zone is a separate series, never a blend.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source, ts_utc, region, resolution]
    columns:
      - name: source
        tests: [not_null]
      - name: ts_utc
        tests: [not_null]
      - name: region
        tests: [not_null]
      - name: resolution
        tests: [not_null]
      - name: price_eur_mwh
        description: Day-ahead price; goes negative, so the accepted range allows it.
        tests:
          - dbt_utils.accepted_range:
              min_value: -500
              max_value: 4000
              config:
                where: "price_eur_mwh is not null"

  - name: stg_grid_load
    description: Total grid load / Netzlast (MW). Grain (source, ts_utc, region, resolution).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source, ts_utc, region, resolution]
    columns:
      - name: source
        tests: [not_null]
      - name: ts_utc
        tests: [not_null]
      - name: region
        tests: [not_null]
      - name: resolution
        tests: [not_null]
      - name: load_mw
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 120000
              config:
                where: "load_mw is not null"

  - name: stg_weather_actuals
    description: >
      Open-Meteo weather actuals, one wide row per UTC hour and source.
      Grain (source, ts_utc, region).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source, ts_utc, region]
    columns:
      - name: source
        tests: [not_null]
      - name: ts_utc
        tests: [not_null]
      - name: ghi_w_m2
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1500, config: {where: "ghi_w_m2 is not null"}}
      - name: direct_radiation_w_m2
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1500, config: {where: "direct_radiation_w_m2 is not null"}}
      - name: diffuse_radiation_w_m2
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1500, config: {where: "diffuse_radiation_w_m2 is not null"}}
      - name: temperature_c
        tests:
          - dbt_utils.accepted_range: {min_value: -40, max_value: 50, config: {where: "temperature_c is not null"}}
      - name: cloud_cover_pct
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100, config: {where: "cloud_cover_pct is not null"}}
      - name: wind_speed_m_s
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 75, config: {where: "wind_speed_m_s is not null"}}

  - name: stg_telemetry
    description: >
      Household telemetry (kWh), one wide row per UTC hour and source. Grain (source, ts_utc,
      region): the synthetic demo generator and the real Fenecon reader can both write the same
      site, and they stay separate series here. Downstream selects one with the `telemetry_source`
      var -- see assert_single_telemetry_source_per_site.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source, ts_utc, region]
    columns:
      - name: source
        tests: [not_null]
      - name: ts_utc
        tests: [not_null]
      - name: soc_frac
        description: End-of-hour state of charge, fraction in [0, 1].
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 1, config: {where: "soc_frac is not null"}}
      - name: pv_production_kwh
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "pv_production_kwh is not null"}}
      - name: household_load_kwh
        description: >
          Total household consumption, and the canonical one. From M10 it is separable into
          load_base_kwh + ac_power_kwh, but it is emitted independently rather than derived from
          them: a total computed as the sum of its parts could not be tested against them, and a
          house with one consumption meter and no AC sub-meter reports this column alone.
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "household_load_kwh is not null"}}
      - name: load_base_kwh
        description: >
          Consumption excluding the air conditioner. NULL wherever the producer cannot separate
          the two -- never back-derived by subtraction, which would fabricate a split from a meter
          that never measured one. See assert_load_split_identity.
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "load_base_kwh is not null"}}
      - name: ac_power_kwh
        description: >
          Electrical energy drawn by the air conditioner. Real mode requires a separately metered
          source (the HVAC integration's own power sensor, or an external meter); where none is
          configured this is NULL, never estimated and never assumed zero.
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "ac_power_kwh is not null"}}
      - name: indoor_temp_c
        description: >
          Zone air temperature at the end of the hour, degrees Celsius. A state, not a flow, so it
          takes no part in the energy identities -- ranged like the outdoor temperature it is
          driven by rather than floored at zero, since a habitable-range check here would encode
          an assumption about the house rather than about the data.
        tests:
          - dbt_utils.accepted_range: {min_value: -40, max_value: 50, config: {where: "indoor_temp_c is not null"}}
      - name: battery_charge_kwh
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "battery_charge_kwh is not null"}}
      - name: battery_discharge_kwh
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "battery_discharge_kwh is not null"}}
      - name: grid_import_kwh
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "grid_import_kwh is not null"}}
      - name: grid_export_kwh
        tests:
          - dbt_utils.accepted_range: {min_value: 0, config: {where: "grid_export_kwh is not null"}}

  - name: stg_weather_forecast
    description: >
      Weather forecast vintages, one wide row per (issue_time, target_ts_utc). The only reader of
      raw.forecast_observations -- see tests/dbt/test_no_lookahead.py.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [source, issue_date, issue_time, target_ts_utc, region]
    columns:
      - name: source
        tests: [not_null]
      - name: issue_time
        tests: [not_null]
      - name: issue_date
        tests: [not_null]
      - name: target_ts_utc
        tests: [not_null]
      - name: temperature_c
        tests:
          - dbt_utils.accepted_range: {min_value: -40, max_value: 50, config: {where: "temperature_c is not null"}}
      - name: cloud_cover_pct
        tests:
          - dbt_utils.accepted_range: {min_value: 0, max_value: 100, config: {where: "cloud_cover_pct is not null"}}
