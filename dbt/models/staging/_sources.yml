version: 2

sources:
  - name: raw
    description: >
      The append-only ingestion raw zone written by `energy-platform backfill` /
      `forecast-snapshot`. Read-only here: staging models never mutate it.
    schema: "{{ env_var('ENERGY_RAW_SCHEMA', 'raw') }}"
    tables:
      - name: observations_current
        description: >
          Latest-ingestion observations per partition (a SMARD revision appends a new version;
          readers see one clean series). Columns: dataset, region, resolution, ts_utc, value,
          is_missing. Note: the view omits `source`; join `ingestion` on ingestion_id for it.
      - name: observations
        description: Faithful long-form unnest of every ingestion (all versions, not just latest).
      - name: ingestion
        description: One row per successful partition ingestion; carries `source` and `fetched_at`.
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: forecast_observations
        description: >
          Weather forecast vintages, keyed by (issue_time, target_ts_utc). Never collapsed to
          "latest" -- each vintage is an independent truth. ONLY stg_weather_forecast may read
          this (enforced by tests/dbt/test_no_lookahead.py).
      - name: forecast_ingestion
        description: One row per forecast vintage; carries issue_date, issue_time, fetched_at.

  - name: derived
    description: >
      Results computed by the Python package and read back here -- currently the M6 battery
      dispatch optimiser (`energy-platform dispatch`). Read-only, like `raw`.

      A DIFFERENT CONTRACT FROM THE RAW ZONE, deliberately. Ingestion is content-hashed and
      bit-reproducible, so re-running it is a verifiable no-op. An optimal dispatch is not:
      the optimal *value* is unique, but the optimal *schedule* generally is not (equally-priced
      hours are interchangeable), so a re-solve may legitimately return a different schedule with
      an identical cost. These tables are therefore replace-on-rerun rather than
      append-with-hash, and downstream models assert on cost and on invariants -- never on a
      specific hour's charge value. See src/energy_platform/dispatch/store.py.

      Because the optimiser reads mart_hourly_energy and writes these tables, it runs BETWEEN two
      dbt invocations; `just warehouse` is the sequence that works on an empty database.
    schema: "{{ env_var('ENERGY_DERIVED_SCHEMA', 'derived') }}"
    tables:
      - name: dispatch_runs
        description: >
          One row per (region, window, tariff, scenario): the settled totals, the terminal-SoC
          adjustment, and the solver and input digest that produced them.
      - name: dispatch_schedule
        description: >
          The hourly schedule behind each run -- flows, state of charge, and per-hour money.
          `is_priced` marks the hours every term was present for, exactly as
          int_hourly_tariff_cost does, so the two layers aggregate on the same flag.
      - name: forecast_runs
        description: >
          One row per (site, target, model, window) backtested by `energy-platform forecast`,
          carrying the provenance a prediction is traceable through: config_hash over the fit's
          inputs, the vintage-selection and persistence rule ids, the observation lag, the
          training data source, and the library versions. `role` distinguishes a model from a
          baseline and from the ORACLE -- on synthetic windows the flat-plate PV model is the
          process that generated the labels, so it wins by tautology and must not be ranked
          against the others.
      - name: forecast_predictions
        description: >
          One row per (run, hour): p10/p50/p90 and the actual, with the issue instant and the
          vintage the features came from. Null where a model made no prediction or no actual
          exists -- a gap is never scored as a zero.
      - name: forward_dispatch_runs
        description: >
          M8's four-way comparison, one row per (region, window, tariff, scenario) over the
          SIMULATED SPAN -- which is generally shorter than the declared window, because the
          forecast models need warm-up before anything can be planned, and is therefore recorded
          as its own sim_start/sim_end rather than inferred from the window.

          A declared window that could not be simulated at all is still written, with
          is_simulated = false and a not_simulated_reason, under the sentinel tariff_id '*'. That
          is deliberate: a window that simply vanished would let every coverage test downstream
          pass over something nobody could see was absent.

          Carries the rule ids the simulation ran under -- the decision time, the day-ahead price
          publication rule and M7's vintage selection rule -- so a stored result names its own
          rules rather than relying on a docstring having said the same thing at the time.
      - name: forward_dispatch_days
        description: >
          The rolling structure, one row per (run, Berlin day): the state-of-charge chain along the
          EXECUTED trajectory, whether the day was planned or fell back to naive self-consumption,
          how many hours the plan had to be clipped to stay feasible, and the day's settled money.
          Only the forecast_driven scenario has a plan and a decision time; the two reference
          scenarios carry plan_status = 'not_planned' rather than a guess.
      - name: forward_dispatch_schedule
        description: >
          The hourly executed flows, with the PLANNED battery legs beside them and a was_clipped
          flag, so plan-versus-reality is inspectable rather than something the reader has to take
          on faith. Planned columns are null for the two reference scenarios, which were never
          planned.
