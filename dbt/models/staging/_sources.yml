version: 2

sources:
  - name: raw
    description: >
      The append-only ingestion raw zone written by `energy-platform backfill` /
      `forecast-snapshot`. Read-only here: staging models never mutate it.
    schema: "{{ env_var('ENERGY_RAW_SCHEMA', 'raw') }}"
    tables:
      - name: observations_current
        description: >
          Latest-ingestion observations per partition (a SMARD revision appends a new version;
          readers see one clean series). Columns: dataset, region, resolution, ts_utc, value,
          is_missing. Note: the view omits `source`; join `ingestion` on ingestion_id for it.
      - name: observations
        description: Faithful long-form unnest of every ingestion (all versions, not just latest).
      - name: ingestion
        description: One row per successful partition ingestion; carries `source` and `fetched_at`.
        loaded_at_field: fetched_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: forecast_observations
        description: >
          Weather forecast vintages, keyed by (issue_time, target_ts_utc). Never collapsed to
          "latest" -- each vintage is an independent truth. ONLY stg_weather_forecast may read
          this (enforced by tests/dbt/test_no_lookahead.py).
      - name: forecast_ingestion
        description: One row per forecast vintage; carries issue_date, issue_time, fetched_at.

  - name: derived
    description: >
      Results computed by the Python package and read back here -- currently the M6 battery
      dispatch optimiser (`energy-platform dispatch`). Read-only, like `raw`.

      A DIFFERENT CONTRACT FROM THE RAW ZONE, deliberately. Ingestion is content-hashed and
      bit-reproducible, so re-running it is a verifiable no-op. An optimal dispatch is not:
      the optimal *value* is unique, but the optimal *schedule* generally is not (equally-priced
      hours are interchangeable), so a re-solve may legitimately return a different schedule with
      an identical cost. These tables are therefore replace-on-rerun rather than
      append-with-hash, and downstream models assert on cost and on invariants -- never on a
      specific hour's charge value. See src/energy_platform/dispatch/store.py.

      Because the optimiser reads mart_hourly_energy and writes these tables, it runs BETWEEN two
      dbt invocations; `just warehouse` is the sequence that works on an empty database.
    schema: "{{ env_var('ENERGY_DERIVED_SCHEMA', 'derived') }}"
    tables:
      - name: dispatch_runs
        description: >
          One row per (region, window, tariff, scenario): the settled totals, the terminal-SoC
          adjustment, and the solver and input digest that produced them.
      - name: dispatch_schedule
        description: >
          The hourly schedule behind each run -- flows, state of charge, and per-hour money.
          `is_priced` marks the hours every term was present for, exactly as
          int_hourly_tariff_cost does, so the two layers aggregate on the same flag.
