# Isolated toolchain for the dbt analytics layer. dbt-core pins `pathspec<0.13`, which is
# mutually exclusive with the app's mypy, so dbt gets its own uv project + lock rather than a
# dependency-group in the root resolution. Run with `uv run --project dbt dbt ...`; the frozen
# dbt/uv.lock keeps it as reproducible as the rest of the stack.
[project]
name = "energy-platform-dbt"
version = "0.0.0"
description = "Isolated dbt-postgres toolchain for the energy platform analytics layer."
requires-python = "==3.12.*"
dependencies = [
    "dbt-core>=1.9,<1.10",
    "dbt-postgres>=1.9,<1.10",
]

[tool.uv]
package = false
