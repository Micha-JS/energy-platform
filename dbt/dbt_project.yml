name: energy_platform
version: "0.0.0"
config-version: 2
profile: energy_platform

# Pin to the installed adapter line so a silent minor bump can't change compiled SQL semantics.
require-dbt-version: [">=1.9.0", "<1.10.0"]

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# The analytics warehouse is layered; `raw` is read-only source data, never written here.
# dbt writes to analytics_staging / analytics_intermediate / analytics_marts (target schema
# `analytics` + the per-layer +schema suffix).
models:
  energy_platform:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      # Views, NOT ephemeral: the spine's no-duplicate / no-gap data tests must run against a
      # queryable relation.
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  energy_platform:
    +schema: seeds
    tariffs:
      # Types are declared, never inferred: a tariff rate silently landing as text would still
      # multiply (Postgres would cast) right up until a NULL or a locale-formatted value made it
      # fail somewhere far from here. This seed is also read verbatim by the Python tariff engine
      # (src/energy_platform/tariffs/catalog.py) -- one file, two readers, so the rates cannot
      # drift between the SQL marts and the optimiser's objective.
      +column_types:
        tariff_id: varchar
        label: varchar
        kind: varchar
        price_ct_kwh: numeric
        margin_ct_kwh: numeric
        pass_through_ct_kwh: numeric
        base_fee_eur_month: numeric
        vat_rate: numeric

vars:
  # Declared coverage windows (Europe/Berlin, inclusive). The hourly spine is generated from
  # these ranges -- NOT inferred from min/max of the data -- so the two disjoint seeded windows
  # never manifest a seven-month void between them, and "gap" means "missing within declared
  # coverage". Override for full-history dev, e.g.
  #   dbt build --vars '{coverage_windows: [{start: "2023-01-01", end: "2024-12-31"}]}'
  coverage_windows:
    - {start: "2024-03-28", end: "2024-04-03"}
    - {start: "2024-10-24", end: "2024-10-30"}

  # The bidding zone whose day-ahead price the energy mart attaches. 'DE' is the DE-LU
  # (Germany-Luxembourg) zone as SMARD labels it -- the region string the CLI actually ingests
  # prices under. int_hourly_energy filters the price join to this zone so a second ingested price
  # region can never fan out the spine. Override for a different market.
  price_region: "DE"

  # The price provider, for the same reason: a second market connector (ENTSO-E) would publish the
  # same bidding zone at the same instant, and the price join must attach exactly one of them.
  # 'smard' is the only connector that ingests prices today.
  price_source: "smard"

  # Which feed-in compensation scheme is in force. Unlike `telemetry_source`, a default IS safe
  # here: the catalogue ships exactly one feed_in row, and pricing exports at the wrong statutory
  # rate is a visible arithmetic error rather than a silent data swap. It is a var rather than a
  # hardcoded id because EEG rates are set by commissioning date, so a second system -- or a
  # second year -- means a second row. Mirrors ENERGY_FEED_IN_TARIFF_ID on the Python side.
  #   dbt build --vars '{feed_in_tariff_id: eeg_2025}'
  feed_in_tariff_id: "eeg_2024"

  # `telemetry_source` selects which connector the energy models read when more than one writes the
  # same site (the synthetic demo generator and the real Fenecon reader both default to
  # region = site_id). Deliberately NOT declared here: no default is safe -- 'synthetic' would drop
  # a real house, 'fenecon' would empty the demo -- so with two sources present and no override,
  # assert_single_telemetry_source_per_site fails and names the var. Set it explicitly:
  #   dbt build --vars '{telemetry_source: fenecon}'
