# Mosquitto for the demo broker profile and for CI's one integration test.
#
# Anonymous and unauthenticated ON PURPOSE, and only safe because of what it is used for: a
# throwaway broker on a container network (compose) or on the runner's loopback (CI), holding
# nothing but synthetic plans for synthetic days. Mosquitto 2.x refuses non-local connections
# without an explicit listener, which is why this file has to exist at all -- the default config
# would leave the demo's broker unreachable from the Dagster container.
#
# A REAL deployment does not use this file. Point ENERGY_MQTT_HOST at the household's own broker
# (Home Assistant's Mosquitto add-on, typically), set ENERGY_MQTT_USER / ENERGY_MQTT_PASSWORD, and
# turn on ENERGY_MQTT_TLS if the broker terminates it. Those come from the environment and are
# never committed -- same rule as the Home Assistant connector's token.

listener 1883
allow_anonymous true

# Retained messages must survive a broker restart, or the demo's central claim -- that Home
# Assistant re-reads the latest plan after a restart -- would only hold while nothing restarted.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
